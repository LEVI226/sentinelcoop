version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: digicoop
      POSTGRES_PASSWORD: digicoop
      POSTGRES_DB: digicoop_central
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://digicoop:digicoop@postgres:5432/digicoop_central
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
